<ng-template #iconTpl let-icono="icono">
  <span class="nav-icon">
    <svg *ngIf="icono === 'home'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-9z" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg *ngIf="icono === 'chart'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg *ngIf="icono === 'card'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18" stroke-linecap="round"/></svg>
    <svg *ngIf="icono === 'money'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="20" height="10" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
    <svg *ngIf="icono === 'grid'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
    <svg *ngIf="icono === 'tag'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12l-8 8-9-9V4h7l10 10z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>
    <svg *ngIf="icono === 'pie'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v10l7 7A10 10 0 0 0 12 2z" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 12L5 19A10 10 0 0 1 12 2v10z" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg *ngIf="icono === 'clipboard'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1M9 11h6M9 15h6" stroke-linecap="round"/></svg>
  </span>
</ng-template>

<div class="dashboard">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <button class="icon-circle" type="button" aria-label="Notificaciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M13.7 21a2 2 0 0 1-3.4 0" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button class="icon-circle" type="button" aria-label="Colapsar menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <ng-container *ngFor="let item of itemsSidebar">
        <a
          *ngIf="item.ruta"
          class="nav-item"
          [routerLink]="item.ruta"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
        >
          <ng-container *ngTemplateOutlet="iconTpl; context: { icono: item.icono }"></ng-container>
          {{ item.label }}
        </a>
        <button
          *ngIf="!item.ruta"
          type="button"
          class="nav-item"
          [class.active]="item.label === activoManual()"
          (click)="seleccionar(item.label)"
        >
          <ng-container *ngTemplateOutlet="iconTpl; context: { icono: item.icono }"></ng-container>
          {{ item.label }}
        </button>
      </ng-container>
    </nav>

    <div class="sidebar-bottom">
      <a class="nav-item small">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        Setting
      </a>
      <button class="nav-item small" type="button" (click)="salir()">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        Cerrar sesion
      </button>
    </div>
  </aside>

  <!-- Contenido principal -->
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="logo-badge"></span>
        <span class="wordmark">CASH <strong>TRACK</strong></span>
      </div>

      <nav class="topbar-nav">
        <a class="pill" routerLink="/gastos" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Saldo actual</a>
        <a class="pill" routerLink="/gastos/gastos" routerLinkActive="active">Gastos</a>
        <a class="pill" routerLink="/gastos/ingresos" routerLinkActive="active">Ingresos</a>
        <a class="pill" routerLink="/gastos/ahorro" routerLinkActive="active">Ahorro</a>
      </nav>

      <div class="topbar-actions">
        <div class="search-wrap">
          <button
            class="icon-circle dark"
            type="button"
            aria-label="Buscar"
            (click)="toggleBusqueda()"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
          </button>

          <div class="search-panel" *ngIf="busquedaAbierta()">
            <input
              type="text"
              placeholder="Buscar por descripcion o categoria..."
              [ngModel]="busquedaTexto()"
              (ngModelChange)="busquedaTexto.set($event)"
              autofocus
            />
            <div class="search-results" *ngIf="busquedaTexto().trim()">
              <p class="empty-hint" *ngIf="!resultadosBusqueda().length">Sin resultados.</p>
              <button
                type="button"
                class="search-row"
                *ngFor="let r of resultadosBusqueda()"
                (click)="irAResultado(r.ruta)"
              >
                <span class="tipo" [class]="r.tipo.toLowerCase()">{{ r.tipo }}</span>
                <span class="desc">{{ r.descripcion }}</span>
                <span class="monto">Q{{ r.monto | number: '1.0-2' }}</span>
              </button>
            </div>
          </div>
        </div>

        <div class="perfil-wrap">
          <button class="user-chip" type="button" (click)="perfilPanel.toggle()">
            <span class="icon-circle dark">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6" stroke-linecap="round"/></svg>
            </span>
            <div class="user-info">
              <strong>{{ authService.usuario()?.nombre }}</strong>
              <small>{{ authService.usuario()?.rol === 'ADMIN' ? 'Admin' : 'Usuario' }}</small>
            </div>
          </button>

          <div class="perfil-panel" *ngIf="perfilPanel.abierto()">
            <div class="perfil-header">
              <span class="icon-circle dark lg">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6" stroke-linecap="round"/></svg>
              </span>
              <div>
                <strong>{{ authService.usuario()?.nombre }}</strong>
                <small>{{ authService.usuario()?.email }}</small>
              </div>
            </div>
            <div class="perfil-rol">
              Rol: <strong>{{ authService.usuario()?.rol === 'ADMIN' ? 'Administrador' : 'Usuario' }}</strong>
            </div>
            <a
              *ngIf="authService.esAdmin()"
              class="perfil-link"
              routerLink="/admin"
              (click)="perfilPanel.cerrar()"
            >
              Panel de administracion
            </a>
            <button class="perfil-salir" type="button" (click)="salir()">Cerrar sesion</button>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
