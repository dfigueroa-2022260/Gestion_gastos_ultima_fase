<div class="card">
  <div class="panel-form">
    <div class="brand-row">
      <span class="logo-badge"></span>
      <div class="brand">Cash Track</div>
    </div>
    <p class="tagline">Inicia sesion para continuar</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="field">
        <label for="email">Correo</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="nombre@correo.com"
          autocomplete="email"
          [class.error]="email.invalid && email.touched"
        />
        <div class="error-msg" *ngIf="email.invalid && email.touched">
          Ingresa un correo valido.
        </div>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
          [class.error]="password.invalid && password.touched"
        />
        <div class="error-msg" *ngIf="password.invalid && password.touched">
          La contraseña es obligatoria.
        </div>
      </div>

      <div class="error-msg" style="margin-bottom: 12px;" *ngIf="errorServidor()">
        {{ errorServidor() }}
      </div>

      <div class="row-between">
        <a routerLink="/olvide-password">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" [disabled]="cargando()">
        <span class="spinner" [class.show]="cargando()"></span>
        <span>{{ cargando() ? 'Entrando...' : 'Entrar' }}</span>
      </button>
    </form>
    <app-google-login></app-google-login>

    <div class="footer-link">
      ¿No tienes cuenta? <a routerLink="/registro">Registrate</a>
    </div>
  </div>

  <div class="panel-right">
    <div class="dashboard-backdrop" aria-hidden="true">
      <div class="preview-card" *ngFor="let card of [0,1,2,3]">
        <div class="preview-heading"></div><div class="preview-subtitle"></div>
        <div class="preview-bars" *ngIf="card !== 3"><span *ngFor="let height of [24,48,35,64,52,82]" [style.height.%]="height"><i></i></span></div>
        <svg *ngIf="card === 3" viewBox="0 0 200 120"><path d="M5 102 36 76 62 84 94 46 124 68 158 18 194 48" fill="none" stroke="#df843e" stroke-width="7" /></svg>
        <div class="preview-ticks"><i *ngFor="let tick of [0,1,2,3,4,5]"></i></div>
      </div>
    </div>
    <div class="panel-right-content">
      <div class="panel-right-mark">Cash Track</div>
      <p class="panel-right-copy">
        Controla tus gastos d&#237;a a d&#237;a, con orden y claridad.
      </p>
    </div>
  </div>
</div>
